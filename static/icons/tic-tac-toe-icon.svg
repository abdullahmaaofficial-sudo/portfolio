<svg width="256" height="256" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- grid lines -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.95">
    <line x1="24" y1="10" x2="24" y2="54"/>
    <line x1="40" y1="10" x2="40" y2="54"/>
    <line x1="10" y1="24" x2="54" y2="24"/>
    <line x1="10" y1="40" x2="54" y2="40"/>
  </g>

  <!-- X top-left -->
  <g stroke="#FDE68A" stroke-width="3.4" stroke-linecap="round">
    <line x1="14.5" y1="14.5" x2="20.5" y2="20.5"/>
    <line x1="20.5" y1="14.5" x2="14.5" y2="20.5"/>
  </g>

  <!-- O center -->
  <circle cx="32" cy="32" r="4.6" fill="none" stroke="#FFFFFF" stroke-width="3.2"/>

  <!-- X bottom-right -->
  <g stroke="#FDE68A" stroke-width="3.4" stroke-linecap="round">
    <line x1="43.5" y1="43.5" x2="49.5" y2="49.5"/>
    <line x1="49.5" y1="43.5" x2="43.5" y2="49.5"/>
  </g>
</svg>